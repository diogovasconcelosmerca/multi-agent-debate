name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs so a fast-pushing branch doesn't queue up
# duplicate work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .
        # Soft-fail formatting until the codebase is fully reformatted —
        # remove `continue-on-error` once `ruff format .` is committed.
        continue-on-error: true

      - name: Type-check (mypy)
        run: mypy core
        continue-on-error: true

      - name: Run unit tests
        run: pytest --cov=core --cov-report=term-missing
